<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>CSS MARGIN</title>
	<!-- Margins are used to create space around elements, outside of any defined borders. -->
	<style type="text/css">
		p.top{
			margin-top: 50px;
			background-color: aqua;
			border: 2px solid black;
		}
		p.right{
			margin-right: 200px; 
			position: fixed; 
			right: 0px;
			background-color: aqua;
		}
		p.bottom{
			margin-bottom: 50px;
			background-color: aqua;
			border: 1px solid black;
		}
		p.left{
			margin-left: 50px;
			background-color: aqua;
			border: 1px solid black;
		}
		p.margin{
			margin: 50px;
		}
		p.shorthand{
			margin: 25px 50px 75px;
		/* The margin property 3 values aside top, lefft right, bottom */
		}
		h1 {
			margin: 0 0 50px 0;
			background-color: aqua;
		}
		h2 {
			margin: 20px 0 0 0;
			background-color: aqua;
		}
	</style>
</head>
<body>
	<p class="top">The is  margin top</p>
	<p class="right">The is  margin right</p>
	<p class="bottom">The is  margin bottom</p>
	<p class="left">The is  margin left</p>
	<p class="margin">The is  margin margin: 50px;</p>
	<p class="shorthand">The margin shorthand property - 3 values</p>
	<h1>Heading 1</h1>
	<h2>Heading 2</h2>
</body>
</html>

<!-- With CSS, you have full control over the margins. There are properties for setting the margin for each side of an element (top, right, bottom, and left). -->

<!-- 01:- Margin - Individual Sides -->
	<!-- CSS has properties for specifying the margin for each side of an element:	
	margin-top
	margin-right
	margin-bottom
	margin-left
	All the margin properties can have the following values:
	auto - the browser calculates the margin
	length - specifies a margin in px, pt, cm, etc.
	% - specifies a margin in % of the width of the containing element
	inherit - specifies that the margin should be inherited from the parent element -->

<!-- 02:- Margin - Shorthand Property -->
	<!-- margin-top: 10px;
	margin-right: 20px;
	margin-bottom: 30px;
	margin-left: 40px;
	margin: 25px 50px 75px 100px;
	margin: 25px 50px 75px;  top, right left, bottom.
	margin: 20px 25px;
	margin: 20px; -->

<!-- 03:- Margin Collapse -->
	<!-- Top and bottom margins of elements are sometimes collapsed into a single margin that is equal to the largest of the two margins
	This does not happen on left and right margins! Only top and bottom margins!
	Look at the following example:
	<style>
		h1 {margin: 0 0 50px 0;}
		h2 {margin: 20px 0 0 0;}
	</style>	
	<h1>Heading 1</h1>
	<h2>Heading 2</h2>
	In this example the h1 element has a bottom margin of 50px and the h2 element has a top margin of 20px. So, the vertical margin between h1 and h2 should have been 70px (50px + 20px). However, due to margin collapse, the actual margin ends up being 50px -->
