<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Link</title>
	<link rel="stylesheet" type="text/css" href="link.css">
</head>
<body>

	<p><a href="https://www.wikipedia.org/">This is wikipedia link</a></p>

	<!-- The cursor Property -->
	<section class="section">
		<span style="cursor: auto; font-size:1.5rem;">auto</span><br>
		<span style="cursor: crosshair; font-size:1.5rem;">crosshair</span><br>
		<span style="cursor: default; font-size:1.5rem;">default</span><br>
		<span style="cursor: help; font-size:1.5rem;">help</span><br>
		<span style="cursor: pointer; font-size:1.5rem;">pointer</span><br>
		<span style="cursor: progress; font-size:1.5rem;">progress</span><br>
		<span style="cursor: text; font-size:1.5rem;">text</span><br>
		<span style="cursor: wait; font-size:1.5rem;">wait</span><br>
	</section>

	<button><a href=""></a></button>
</body>
</html>

<!-- 01:- CSS Links -->
	<!--With CSS, links can be styled in many different ways.
	Links can be styled with any CSS property (e.g. color, font-family, background, etc.).

	In addition, links can be styled differently depending on what state they are in
	The four links states are:
	a:link - a normal, unvisited link
	a:visited - a link the user has visited
	a:hover - a link when the user mouses over it
	a:active - a link the moment it is clicked -->
