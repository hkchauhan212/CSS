<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Icons</title>
	<!-- This link is FOnt Awesome cdn link -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
	<!-- This link is Bootstrap cdn link -->
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
	<!-- This icon is google font cdn link -->
	<link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
	<style type="text/css">
		.icon{
			font-size: 25px;
			color: red;
			margin: 15px;
		}
		.glyphicon{
			font-size: 25px;
			color: green;
			margin-left: 15px;
		}
		.google {
			font-size: 25px;
			color: blue;
			margin-left: 15px;
		}
	</style>
</head>
<body>
	<h2>This icon is show throw font Awesome.</h2>
	<div>
		<i class=" icon fa-brands fa-facebook"></i>
		<i class=" icon fa-solid fa-hashtag"></i>
		<i class=" icon fa-solid fa-user"></i>	
		<i class=" icon fa-brands fa-figma"></i>
	</div>
	<h2>This icon is show throw bootstrap</h2>
	<div>
		<i class="glyphicon glyphicon-cloud"></i>
		<i class="glyphicon glyphicon-remove"></i>
		<i class="glyphicon glyphicon-user"></i>
		<i class="glyphicon glyphicon-envelope"></i>
		<i class="glyphicon glyphicon-thumbs-up"></i>
	</div>
	<h2>This icon is show throw google font</h2>
	<div>
		<i class=" google material-icons">cloud</i>
		<i class=" google material-icons">favorite</i>
		<i class=" google material-icons">attachment</i>
		<i class=" google material-icons">computer</i>
		<i class=" google material-icons">traffic</i>
	</div>
</body>
</html>
