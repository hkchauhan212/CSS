<body>

	<h2>A full-width input field</h2>
	<form>
		<div class="name">
			<label form="name">Enter your name:</label>
			<input class="input_name" type="text" name="Myname" id="name" placeholder="Enter your number">
		</div>
	</form>

	<h2>Padded input fields</h2>
	<form class="form_padding" action="action.php" method="post">
		<div>
			<label for="fname">First Name:</label>
			<input type="text" name="Myfname" id="Fname" placeholder="FIRST NAME">
		</div>
		<div>
			<label for="lname">Last Name:</label>
			<input type="text" name="Mylname" id="lname" placeholder="LAST NAME">
		</div>
		<input type="submit" name="submit">
		<input type="reset" name=reset>
	</form>
