<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Borders</title>
</head>
<body>
	<p style="border: 5px dotted orange;">This border is dotted</p>
	<p style="border: 5px dashed orange;">This border is dashed</p>
	<p style="border: 5px solid whitesmoke;">This border is solid</p>
	<p style="border: 5px double whitesmoke;">This border is double</p>
	<p style="border: 5px groove whitesmoke;">This border is groove</p>
	<p style="border: 5px ridge green;">This border is ridge</p>
	<p style="border: 5px inset green;">This border is inset</p>
	<p style="border: 5px outset green;">This border is outset</p>
	<p style="border: 5px none ;">This border is none</p>
	<p style="border: 5px hidden ;">This border is hidden</p>
	<br><hr>
	<p style="border-width: 5px 1px; border-style: solid;">This paragraph is specific side widths.</p>
</body>
</html>

<!-- 01:- border different different style -->
	<!-- dotted - Defines a dotted border
	dashed - Defines a dashed border
	solid - Defines a solid border
	double - Defines a double border
	groove - Defines a 3D grooved border. The effect depends on the border-color value
	ridge - Defines a 3D ridged border. The effect depends on the border-color value
	inset - Defines a 3D inset border. The effect depends on the border-color value
	outset - Defines a 3D outset border. The effect depends on the border-color value
	none - Defines no border
	hidden - Defines a hidden border -->
